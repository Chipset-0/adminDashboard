<!DOCTYPE html>
<html>
    <header>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </header>
    <body>
        <div class="layout">
            <div class="sidebar">
                <div class="logo">
                    <img src="content/dashboard.svg" alt="Dashboard Icon" class="icon-large">
                    <div class="logo-name">Dashboard</div>
                </div>
                <ul class="application-links">
                    <li>
                        <img src="content/home.svg" alt="Home Icon" class="icon-small">Home
                    </li>
                    <li>
                        <img src="content/card-account-details-outline.svg" alt="Profile Icon" class="icon-small">Profile
                    </li>
                    <li>
                        <img src="content/message.svg" alt="Message Icon" class="icon-small">Messages
                    </li>
                    <li>
                        <img src="content/clock-outline.svg" alt="History Icon" class="icon-small">History
                    </li>
                    <li>
                        <img src="content/file-multiple.svg" alt="Tasks Icon" class="icon-small">Tasks
                    </li>
                    <li>
                        <img src="content/account-group.svg" alt="Community Icon" class="icon-small">Community
                    </li>
                </ul>
                <div class="option-links">
                    <li>
                        <img src="content/cog.svg" alt="Settings Icon" class="icon-small">Settings
                    </li>
                    <li>
                        <img src="content/message-question-outline.svg" alt="Support Icon" class="icon-small">Support
                    </li>
                    <li>
                        <img src="content/shield-check-outline.svg" alt="Privacy Icon" class="icon-small">Privacy
                    </li>
                </div>
            </div>
            <div class="header">
                <div class="search">
                    <img src="content/magnify.svg" alt="Search Icon" class="icon-small">
                    <input type="text" class="searchbar">
                </div>
                <div class="account">
                    <img src="content/bell-ring-outline.svg" alt="Bell Icon" class="icon-small">
                    <img src="content/account-circle.svg" alt="Account Icon" class="icon-small">
                    <div class="account-name">FirstName LastName</div>
                </div>
                <div class="greeting">
                    <img src="content/account-circle.svg" alt="Account Icon" class="icon-large">
                    <div>
                        Hi there,<br>
                        FirstName LastName (@account)
                    </div>
                </div>
                <div class="content-buttons">
                    <button class="button">New</button>
                    <button class="button">Upload</button>
                    <button class="button">Share</button>
                </div>
            </div>
            <div class="content">
                <div class="projects">
                    <h4>Your Projects</h4>
                </div>
                <div class="announcements">
                    <h4>Announcements</h4>

                </div>
                <div class="trending">
                    <h4>Trending</h4>
                </div>
            </div>
        </div>
    </body>
</html>
