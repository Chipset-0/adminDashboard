<!DOCTYPE html>
<html>
    <header>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </header>
    <body>
        <div class="layout">
            <div class="sidebar">
                <div class="logo">
                    <img src="content/dashboard.svg" alt="Dashboard Icon" class="icon-large">
                    <div class="logo-name">Dashboard</div>
                </div>
            </div>
            <div class="header">
                <div class="search">
                    <img src="content/magnify.svg" alt="Search Icon" class="icon-small">
                    <input type="text" class="searchbar">
                </div>
                <div class="account">
                    <img src="content/bell-ring-outline.svg" alt="Bell Icon" class="icon">
                    <img src="content/account-circle.svg" alt="Account Icon" class="icon">
                    <div class="account-name">FirstName LastName</div>
                </div>
                <div class="greeting">
                    <img src="content/account-circle.svg" alt="Account Icon" class="icon-large">
                    <div>
                        Hi there,<br>
                        FirstName LastName (@account)
                    </div>
                </div>
                <div class="content-buttons">
                    <button class="button">New</button>
                    <button class="button">Upload</button>
                    <button class="button">Share</button>
                </div>
            </div>
            <div class="content">
                <div class="projects">
                    <h4>Your Projects</h4>
                </div>
                <div class="announcements">
                    <h4>Announcements</h4>

                </div>
                <div class="trending">
                    <h4>Trending</h4>
                </div>
            </div>
        </div>
    </body>
</html>
